<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Test 5 — Anime Premium</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Spectral:ital@1&display=swap" rel="stylesheet">
<style>
:root{--atk:#ff7a8a;--def:#7fb6ff;--hp:#5fe39a;--gd:#ffd36b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#0a0f1c;color:#f2f6ff;-webkit-font-smoothing:antialiased}
.phone{max-width:440px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(20,28,54,.7),rgba(10,14,28,.85)),url('/decks/sea.png') center/cover}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.g1{width:240px;height:240px;background:#3b6dff;top:-60px;left:-60px}
.g2{width:240px;height:240px;background:#ff5d7a;bottom:40px;right:-70px}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)}
header{position:relative;display:flex;align-items:center;gap:8px;padding:12px 16px}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em;background:linear-gradient(90deg,#ffd36b,#ff8a5b);-webkit-background-clip:text;background-clip:text;color:transparent}
.turn{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;color:#08130c;background:linear-gradient(90deg,#5fe39a,#37c97a);padding:6px 13px;border-radius:999px;box-shadow:0 4px 14px rgba(95,227,154,.4)}
.board{position:relative;padding:8px 14px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:8px 4px 6px}
.fleet{position:relative;display:flex;align-items:center;gap:9px;padding:10px;border-radius:22px}
.ship{width:80px;flex:none}.ship img{width:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.units{display:flex;gap:8px;flex:1}
.u{flex:1;min-width:0;border-radius:16px;overflow:hidden;position:relative;background:rgba(10,16,30,.5);border:1px solid rgba(255,255,255,.12)}
.u .art{height:58px;background-size:cover;background-position:center 22%}
.u .ov{padding:3px 7px 5px}
.u .nm{font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .st{display:flex;gap:6px;font-size:10px;font-weight:700;margin-top:1px}
.st .a{color:var(--atk)}.st .d{color:var(--def)}.st .h{color:var(--hp)}
.cap{flex:none;width:112px;border:1px solid rgba(255,211,107,.5);box-shadow:0 0 22px rgba(255,211,107,.2)}
.cap .art{height:72px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:5px 7px 3px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#37c97a,#5fe39a);box-shadow:0 0 10px rgba(95,227,154,.7)}
.cost{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;color:#08130c;
  background:linear-gradient(180deg,#ffe08a,#ffce5b);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.vs{display:flex;align-items:center;gap:10px;margin:14px 6px}
.vs .l{flex:1;height:2px;border-radius:9px;background:linear-gradient(90deg,transparent,rgba(255,211,107,.6),transparent)}
.vs .t{font-weight:800;font-size:14px;letter-spacing:.12em;color:var(--gd);text-shadow:0 0 14px rgba(255,211,107,.5)}
footer{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 18px;background:linear-gradient(0deg,rgba(8,12,24,.92),transparent)}
.hand{display:flex;gap:9px;justify-content:center;margin-bottom:12px}
.h{width:62px;height:88px;border-radius:14px;background-size:cover;background-position:center 20%;
  border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 22px rgba(0,0,0,.55)}
.h:nth-child(1){transform:rotate(-6deg) translateY(6px)}.h:nth-child(3){transform:rotate(6deg) translateY(6px)}
.cta{display:flex;gap:9px}
.btn{flex:1;font-family:'Poppins';font-weight:700;font-size:14px;padding:14px;border:none;border-radius:16px;color:#08130c;
  background:linear-gradient(135deg,#ffd36b,#ff9d5b);box-shadow:0 8px 24px rgba(255,157,91,.45)}
.btn-x{flex:none;width:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);color:#fff}
.tag{position:fixed;top:8px;left:8px;font-family:'Poppins';font-weight:600;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:5px 10px;border-radius:999px;z-index:9;border:1px solid rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="tag">TEST 5 · Anime Premium</div>
<div class="phone">
  <div class="glow g1"></div><div class="glow g2"></div>
  <header><span class="brand">TCGOP</span><span class="turn">✦ Votre tour</span></header>
  <div class="board">
    <div class="lbl">⚓ Marine — Adversaire</div>
    <div class="fleet glass">
      <div class="ship"><img src="/decks/marine-deck-v.png"/></div>
      <div class="units">
        <div class="u cap"><span class="cost">C</span><div class="art" style="background-image:url('/cards/akainu-recto.jpg')"></div><div class="bar"><i style="width:100%"></i></div><div class="ov"><div class="nm">Akainu</div><div class="st"><span class="a">⚔9</span><span class="d">🛡4</span></div></div></div>
        <div class="u"><span class="cost">3</span><div class="art" style="background-image:url('/cards/smoker.jpg')"></div><div class="ov"><div class="nm">Smoker</div><div class="st"><span class="a">5</span><span class="d">3</span><span class="h">6</span></div></div></div>
        <div class="u"><span class="cost">2</span><div class="art" style="background-image:url('/cards/tashigi.jpg')"></div><div class="ov"><div class="nm">Tashigi</div><div class="st"><span class="a">4</span><span class="d">2</span><span class="h">5</span></div></div></div>
      </div>
    </div>
    <div class="vs"><div class="l"></div><div class="t">TOUR 6</div><div class="l"></div></div>
    <div class="lbl">🏴‍☠️ Mugiwara — Vous</div>
    <div class="fleet glass">
      <div class="ship"><img src="/decks/mugiwara-deck-v.png"/></div>
      <div class="units">
        <div class="u cap"><span class="cost">C</span><div class="art" style="background-image:url('/cards/luffy-recto.jpg')"></div><div class="bar"><i style="width:78%"></i></div><div class="ov"><div class="nm">Luffy</div><div class="st"><span class="a">⚔8</span><span class="d">🛡3</span></div></div></div>
        <div class="u"><span class="cost">3</span><div class="art" style="background-image:url('/cards/zoro.jpg')"></div><div class="ov"><div class="nm">Zoro</div><div class="st"><span class="a">6</span><span class="d">3</span><span class="h">7</span></div></div></div>
        <div class="u"><span class="cost">2</span><div class="art" style="background-image:url('/cards/sanji.jpg')"></div><div class="ov"><div class="nm">Sanji</div><div class="st"><span class="a">5</span><span class="d">2</span><span class="h">6</span></div></div></div>
      </div>
    </div>
  </div>
  <footer>
    <div class="hand">
      <div class="h" style="background-image:url('/cards/nami.jpg')"></div>
      <div class="h" style="background-image:url('/cards/usopp.jpg')"></div>
      <div class="h" style="background-image:url('/cards/chopper.jpg')"></div>
    </div>
    <div class="cta"><button class="btn">Fin de tour ➜</button><button class="btn-x">✕</button></div>
  </footer>
</div>
</body>
</html>
