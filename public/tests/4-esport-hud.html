<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Test 4 — E-sport HUD</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#46d6e6;--gd:#e8b84b;--atk:#ff6a5e;--def:#6fb6ff;--hp:#54d27a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Oswald',sans-serif;background:#03070d;color:#dfeaf2}
.phone{max-width:440px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(rgba(3,9,16,.72),rgba(3,9,16,.82)),url('/decks/sea.png') center/cover}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(70,214,230,.04) 0 1px,transparent 1px 3px);pointer-events:none}
.clip{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
header{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,rgba(8,18,28,.9),rgba(8,18,28,.4));border-bottom:1px solid rgba(70,214,230,.3)}
.brand{font-weight:700;letter-spacing:.22em;color:var(--gd);font-size:14px}
.brand b{color:var(--cy)}
.turn{margin-left:auto;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#04121a;background:var(--hp);padding:4px 12px;font-weight:700}
.hud{display:flex;gap:6px;font-size:10px;letter-spacing:.12em;color:rgba(223,234,242,.6)}
.hud span{border:1px solid rgba(70,214,230,.25);padding:3px 8px;background:rgba(70,214,230,.06)}
.board{position:relative;padding:10px 12px}
.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--cy)}
.fleet{position:relative;display:flex;align-items:center;gap:8px;padding:8px;background:linear-gradient(120deg,rgba(10,24,36,.78),rgba(6,14,22,.6));border:1px solid rgba(70,214,230,.22)}
.ship{width:78px;flex:none}.ship img{width:100%;filter:drop-shadow(0 0 10px rgba(70,214,230,.25))}
.units{display:flex;gap:7px;flex:1}
.u{flex:1;min-width:0;position:relative;background:rgba(6,16,24,.85);border:1px solid rgba(70,214,230,.28);padding-bottom:3px}
.u .art{height:56px;background-size:cover;background-position:center 22%}
.u .nm{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:4px;margin:2px 5px;background:rgba(255,255,255,.08)}
.meter i{display:block;height:100%}
.st{display:flex;gap:6px;padding:1px 5px;font-size:10px;font-weight:600}
.st .a{color:var(--atk)}.st .d{color:var(--def)}.st .h{color:var(--hp)}
.cap{flex:none;width:108px;border-color:rgba(232,184,75,.5)}
.cap .art{height:66px}
.cost{position:absolute;top:3px;left:3px;font-size:10px;font-weight:700;color:#04121a;background:var(--gd);padding:1px 6px}
.vs{display:flex;align-items:center;gap:8px;margin:10px 2px}
.vs .l{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent)}
.vs .t{font-size:12px;font-weight:700;letter-spacing:.24em;color:var(--gd)}
footer{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 16px;background:linear-gradient(0deg,rgba(3,9,16,.95),transparent)}
.hand{display:flex;gap:7px;justify-content:center;margin-bottom:10px}
.h{width:60px;height:84px;background-size:cover;background-position:center 20%;border:1px solid rgba(70,214,230,.4);box-shadow:0 0 14px rgba(70,214,230,.2)}
.cta{display:flex;gap:8px}
.btn{flex:1;font-family:'Oswald';font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;padding:13px;border:none;color:#04121a;
  background:linear-gradient(180deg,var(--cy),#1f9fb0);box-shadow:0 0 18px rgba(70,214,230,.4)}
.btn-x{flex:none;width:54px;background:rgba(255,255,255,.08);color:var(--cy);border:1px solid rgba(70,214,230,.4)}
.tag{position:fixed;top:8px;left:8px;font-size:10px;letter-spacing:.1em;background:rgba(0,0,0,.7);color:var(--cy);padding:4px 9px;border:1px solid rgba(70,214,230,.4);z-index:9}
</style>
</head>
<body>
<div class="tag">TEST 4 · E-sport HUD</div>
<div class="phone">
  <div class="scan"></div>
  <header><span class="brand">TCG<b>OP</b></span><span class="turn">● Votre tour</span></header>
  <div class="board">
    <div class="row"><span class="lbl">⚓ Marine</span><div class="hud"><span>MAIN 6</span><span>DECK 44</span></div></div>
    <div class="fleet clip">
      <div class="ship"><img src="/decks/marine-deck-v.png"/></div>
      <div class="units">
        <div class="u cap"><span class="cost">CAP</span><div class="art" style="background-image:url('/cards/akainu-recto.jpg')"></div><div class="nm">Akainu</div><div class="meter"><i style="width:100%;background:var(--hp)"></i></div><div class="st"><span class="a">9</span><span class="d">4</span><span class="h">45/45</span></div></div>
        <div class="u"><span class="cost">3</span><div class="art" style="background-image:url('/cards/smoker.jpg')"></div><div class="nm">Smoker</div><div class="meter"><i style="width:100%;background:var(--hp)"></i></div><div class="st"><span class="a">5</span><span class="d">3</span><span class="h">6</span></div></div>
        <div class="u"><span class="cost">2</span><div class="art" style="background-image:url('/cards/tashigi.jpg')"></div><div class="nm">Tashigi</div><div class="meter"><i style="width:80%;background:var(--gd)"></i></div><div class="st"><span class="a">4</span><span class="d">2</span><span class="h">4</span></div></div>
      </div>
    </div>
    <div class="vs"><div class="l"></div><div class="t">TOUR 06</div><div class="l"></div></div>
    <div class="row"><span class="lbl" style="color:var(--gd)">🏴‍☠️ Mugiwara</span><div class="hud"><span>VOL 7</span><span>MAIN 5</span></div></div>
    <div class="fleet clip" style="border-color:rgba(232,184,75,.35)">
      <div class="ship"><img src="/decks/mugiwara-deck-v.png"/></div>
      <div class="units">
        <div class="u cap"><span class="cost">CAP</span><div class="art" style="background-image:url('/cards/luffy-recto.jpg')"></div><div class="nm">Luffy</div><div class="meter"><i style="width:78%;background:var(--hp)"></i></div><div class="st"><span class="a">8</span><span class="d">3</span><span class="h">39/50</span></div></div>
        <div class="u"><span class="cost">3</span><div class="art" style="background-image:url('/cards/zoro.jpg')"></div><div class="nm">Zoro</div><div class="meter"><i style="width:100%;background:var(--hp)"></i></div><div class="st"><span class="a">6</span><span class="d">3</span><span class="h">7</span></div></div>
        <div class="u"><span class="cost">2</span><div class="art" style="background-image:url('/cards/sanji.jpg')"></div><div class="nm">Sanji</div><div class="meter"><i style="width:66%;background:var(--gd)"></i></div><div class="st"><span class="a">5</span><span class="d">2</span><span class="h">4</span></div></div>
      </div>
    </div>
  </div>
  <footer>
    <div class="hand">
      <div class="h" style="background-image:url('/cards/nami.jpg')"></div>
      <div class="h" style="background-image:url('/cards/usopp.jpg')"></div>
      <div class="h" style="background-image:url('/cards/chopper.jpg')"></div>
    </div>
    <div class="cta"><button class="btn clip">Fin de tour ▸</button><button class="btn-x">✕</button></div>
  </footer>
</div>
</body>
</html>
