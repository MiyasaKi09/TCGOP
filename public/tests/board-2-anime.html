<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Plateau B — Anime</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gd:#ffd36b;--atk:#ff7a8a;--def:#7fb6ff;--hp:#5fe39a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#0a0f1c;color:#f2f6ff;-webkit-font-smoothing:antialiased}
.phone{max-width:440px;margin:0 auto;height:100vh;min-height:760px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(28,38,72,.6),rgba(10,14,28,.85)),url('/decks/sea.png') center/cover}
.glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none;z-index:0}
.g1{width:260px;height:260px;background:#3b6dff;top:-40px;left:-70px}
.g2{width:260px;height:260px;background:#ff5d7a;bottom:60px;right:-80px}
header{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:11px 16px}
.brand{font-weight:800;font-size:17px;background:linear-gradient(90deg,#ffd36b,#ff8a5b);-webkit-background-clip:text;background-clip:text;color:transparent}
.turn{margin-left:auto;font-size:11px;font-weight:700;color:#08130c;background:linear-gradient(90deg,#5fe39a,#37c97a);padding:6px 13px;border-radius:999px;box-shadow:0 4px 14px rgba(95,227,154,.4)}
.arena{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:4px 8px}
.half{position:relative;flex:1;display:flex;align-items:center;gap:8px}
.cap{flex:none;width:76px;text-align:center}
.capimg{width:66px;height:66px;border-radius:50%;background-size:cover;background-position:center 18%;margin:0 auto;border:2px solid var(--gd);box-shadow:0 0 22px rgba(255,211,107,.5)}
.capimg.foe{border-color:#ff7a8a;box-shadow:0 0 22px rgba(255,122,138,.5)}
.capnm{font-weight:700;font-size:10px;margin-top:3px}
.capbar{height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:3px}
.capbar i{display:block;height:100%;background:linear-gradient(90deg,#37c97a,#5fe39a);box-shadow:0 0 8px rgba(95,227,154,.7)}
.deck{position:relative;flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:6px 4px}
.floor{position:absolute;inset:4px 0;border-radius:20px;overflow:hidden;opacity:.45;background-size:cover;background-position:center;
  transform:perspective(720px) rotateX(34deg) scale(1.05);box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.row{position:relative;z-index:2;display:flex;gap:8px;justify-content:center}
.row.back{transform:scale(.9);opacity:.95}
.slot{flex:1;max-width:120px;min-width:0;height:64px;border-radius:16px;position:relative;border:1.5px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.slot.unit{border:1px solid rgba(255,255,255,.16);background:rgba(10,16,30,.6);overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.slot .art{position:absolute;inset:0;background-size:cover;background-position:center 22%}
.slot .ov{position:absolute;left:0;right:0;bottom:0;padding:2px 6px;background:linear-gradient(180deg,transparent,rgba(8,12,24,.94))}
.slot .nm{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .st{display:flex;gap:5px;font-size:10px;font-weight:700}
.st .a{color:var(--atk)}.st .d{color:var(--def)}.st .h{color:var(--hp)}
.cost{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;color:#08130c;background:linear-gradient(180deg,#ffe08a,#ffce5b);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 7px rgba(0,0,0,.5)}
.empty{display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,.32)}
.clash{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:0 12px}
.clash .l{flex:1;height:2px;border-radius:9px;background:linear-gradient(90deg,transparent,rgba(255,211,107,.6),transparent)}
.clash .t{font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--gd);text-shadow:0 0 14px rgba(255,211,107,.5)}
footer{position:relative;z-index:3;padding:6px 14px 18px;background:linear-gradient(0deg,rgba(8,12,24,.92),transparent)}
.hand{display:flex;gap:9px;justify-content:center;margin-bottom:10px}
.h{width:60px;height:86px;border-radius:14px;background-size:cover;background-position:center 20%;border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 22px rgba(0,0,0,.55)}
.h:nth-child(1){transform:rotate(-6deg) translateY(5px)}.h:nth-child(4){transform:rotate(6deg) translateY(5px)}
.cta{display:flex;gap:9px}
.btn{flex:1;font-family:'Poppins';font-weight:700;font-size:14px;padding:13px;border:none;border-radius:16px;color:#08130c;background:linear-gradient(135deg,#ffd36b,#ff9d5b);box-shadow:0 8px 22px rgba(255,157,91,.45)}
.btn-x{flex:none;width:52px;border-radius:16px;border:1px solid rgba(255,255,255,.18);color:#fff;background:transparent}
.tag{position:fixed;top:7px;left:7px;font-weight:600;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);z-index:9}
</style>
</head>
<body>
<div class="tag">PLATEAU B · Anime</div>
<div class="phone">
  <div class="glow g1"></div><div class="glow g2"></div>
  <header><span class="brand">TCGOP</span><span class="turn">✦ Votre tour</span></header>
  <div class="arena">
    <div class="half">
      <div class="cap"><div class="capimg foe" style="background-image:url('/cards/akainu-recto.jpg')"></div><div class="capnm">Akainu</div><div class="capbar"><i style="width:100%;background:linear-gradient(90deg,#ff7a8a,#ff5d7a)"></i></div></div>
      <div class="deck">
        <div class="floor" style="background-image:url('/decks/marine-deck-v.png')"></div>
        <div class="row back">
          <div class="slot empty">B1 · Arrière</div>
          <div class="slot unit"><span class="cost">2</span><div class="art" style="background-image:url('/cards/tashigi.jpg')"></div><div class="ov"><div class="nm">Tashigi</div><div class="st"><span class="a">4</span><span class="d">2</span><span class="h">5</span></div></div></div>
          <div class="slot empty">B3</div>
        </div>
        <div class="row front">
          <div class="slot unit"><span class="cost">3</span><div class="art" style="background-image:url('/cards/smoker.jpg')"></div><div class="ov"><div class="nm">Smoker</div><div class="st"><span class="a">5</span><span class="d">3</span><span class="h">6</span></div></div></div>
          <div class="slot empty">V2 · Avant</div>
          <div class="slot unit"><span class="cost">2</span><div class="art" style="background-image:url('/cards/momonga.jpg')"></div><div class="ov"><div class="nm">Momonga</div><div class="st"><span class="a">4</span><span class="d">3</span><span class="h">5</span></div></div></div>
        </div>
      </div>
    </div>
    <div class="clash"><div class="l"></div><div class="t">⚔ TOUR 6</div><div class="l"></div></div>
    <div class="half">
      <div class="cap"><div class="capimg" style="background-image:url('/cards/luffy-recto.jpg')"></div><div class="capnm">Luffy</div><div class="capbar"><i style="width:78%"></i></div></div>
      <div class="deck">
        <div class="floor" style="background-image:url('/decks/mugiwara-deck-v.png')"></div>
        <div class="row front">
          <div class="slot unit"><span class="cost">3</span><div class="art" style="background-image:url('/cards/zoro.jpg')"></div><div class="ov"><div class="nm">Zoro</div><div class="st"><span class="a">6</span><span class="d">3</span><span class="h">7</span></div></div></div>
          <div class="slot unit"><span class="cost">2</span><div class="art" style="background-image:url('/cards/sanji.jpg')"></div><div class="ov"><div class="nm">Sanji</div><div class="st"><span class="a">5</span><span class="d">2</span><span class="h">6</span></div></div></div>
          <div class="slot empty">V3 · Avant</div>
        </div>
        <div class="row back">
          <div class="slot unit"><span class="cost">3</span><div class="art" style="background-image:url('/cards/robin.jpg')"></div><div class="ov"><div class="nm">Robin</div><div class="st"><span class="a">4</span><span class="d">2</span><span class="h">6</span></div></div></div>
          <div class="slot empty">B2 · Arrière</div>
          <div class="slot empty">B3</div>
        </div>
      </div>
    </div>
  </div>
  <footer>
    <div class="hand">
      <div class="h" style="background-image:url('/cards/nami.jpg')"></div>
      <div class="h" style="background-image:url('/cards/usopp.jpg')"></div>
      <div class="h" style="background-image:url('/cards/chopper.jpg')"></div>
      <div class="h" style="background-image:url('/cards/franky.jpg')"></div>
    </div>
    <div class="cta"><button class="btn">Fin de tour ➜</button><button class="btn-x">✕</button></div>
  </footer>
</div>
</body>
</html>
