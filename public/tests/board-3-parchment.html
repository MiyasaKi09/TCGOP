<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Plateau C — Parchemin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1c0e;--gd:#9c6a1d;--atk:#b3261e;--def:#1d5fa8;--hp:#2f7d3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Oswald',sans-serif;background:#1a120a;color:#2a1c0e;-webkit-font-smoothing:antialiased}
.phone{max-width:440px;margin:0 auto;height:100vh;min-height:760px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(rgba(214,194,154,.84),rgba(196,170,126,.9)),url('/decks/sea.png') center/cover;background-blend-mode:multiply}
header{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px double #5a3a1a}
.brand{font-family:'Cinzel';font-weight:900;color:#5a3a1a;letter-spacing:.08em;font-size:16px}
.turn{margin-left:auto;font-family:'Cinzel';font-weight:700;font-size:11px;color:#7a1f14;border:2px solid #7a1f14;padding:3px 10px;text-transform:uppercase;letter-spacing:.08em;transform:rotate(-2deg)}
.arena{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px 8px}
.half{position:relative;flex:1;display:flex;align-items:center;gap:8px}
.cap{flex:none;width:76px;text-align:center}
.capimg{width:64px;height:64px;border-radius:50%;background-size:cover;background-position:center 18%;margin:0 auto;border:3px solid #6b4422;filter:sepia(.5) contrast(1.05);box-shadow:0 4px 12px rgba(50,30,10,.5)}
.capnm{font-family:'Cinzel';font-weight:700;font-size:10px;margin-top:3px;color:#2a1c0e}
.capbar{height:6px;border:2px solid #5a3a1a;background:#e7d3a8;overflow:hidden;margin-top:3px}
.capbar i{display:block;height:100%;background:#2f7d3a}
.deck{position:relative;flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px 4px}
.floor{position:absolute;inset:6px 0;border:2px solid #6b4422;overflow:hidden;opacity:.5;background-size:cover;background-position:center;
  transform:perspective(700px) rotateX(34deg) scale(1.04);filter:sepia(.5);box-shadow:inset 0 0 40px rgba(80,50,20,.5)}
.row{position:relative;z-index:2;display:flex;gap:7px;justify-content:center}
.row.back{transform:scale(.9);opacity:.95}
.slot{flex:1;max-width:118px;min-width:0;height:62px;position:relative;border:2px dashed #8a6536;background:rgba(245,232,205,.4)}
.slot.unit{border:2px solid #6b4422;background:#f3e6c8;overflow:hidden;box-shadow:0 4px 10px rgba(60,35,10,.35)}
.slot .art{position:absolute;inset:0;background-size:cover;background-position:center 22%;filter:sepia(.5) contrast(1.05)}
.slot .ov{position:absolute;left:0;right:0;bottom:0;padding:1px 5px;background:linear-gradient(180deg,transparent,rgba(243,230,200,.96))}
.slot .nm{font-family:'Cinzel';font-weight:700;font-size:9px;color:#2a1c0e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .st{display:flex;gap:6px;font-size:10px;font-weight:700}
.st .a{color:var(--atk)}.st .d{color:var(--def)}.st .h{color:var(--hp)}
.cost{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#f3e6c8;border:2px solid #9c6a1d;color:#7a1f14;font-family:'Cinzel';font-weight:900;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:2}
.empty{display:flex;align-items:center;justify-content:center;font-family:'Cinzel';font-size:9px;letter-spacing:.1em;color:#7a5a30}
.clash{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:0 10px}
.clash .l{flex:1;height:2px;background:linear-gradient(90deg,transparent,#7a1f14,transparent)}
.clash .t{font-family:'Cinzel';font-weight:900;font-size:13px;letter-spacing:.14em;color:#7a1f14}
footer{position:relative;z-index:3;padding:6px 12px 16px;background:linear-gradient(0deg,#c4aa7e,transparent);border-top:3px double #5a3a1a}
.hand{display:flex;gap:7px;justify-content:center;margin-bottom:9px}
.h{width:58px;height:82px;background-size:cover;background-position:center 20%;border:2px solid #6b4422;filter:sepia(.4);box-shadow:0 4px 10px rgba(50,30,10,.5)}
.h:nth-child(1){transform:rotate(-6deg)}.h:nth-child(4){transform:rotate(6deg)}
.cta{display:flex;gap:8px}
.btn{flex:1;font-family:'Cinzel';font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:12px;border:2px solid #5a3a1a;background:linear-gradient(180deg,#c9962f,#9c6a1d);color:#2a1c0e}
.btn-x{flex:none;width:50px;background:#e7d3a8;color:#5a3a1a;border:2px solid #5a3a1a}
.tag{position:fixed;top:7px;left:7px;font-size:10px;font-weight:700;background:#5a3a1a;color:#f3e6c8;padding:4px 9px;border-radius:3px;z-index:9}
</style>
</head>
<body>
<div class="tag">PLATEAU C · Parchemin</div>
<div class="phone">
  <header><span class="brand">⚓ TCGOP</span><span class="turn">Votre tour</span></header>
  <div class="arena">
    <div class="half">
      <div class="cap"><div class="capimg" style="background-image:url('/cards/akainu-recto.jpg')"></div><div class="capnm">Akainu</div><div class="capbar"><i style="width:100%;background:#b3261e"></i></div></div>
      <div class="deck">
        <div class="floor" style="background-image:url('/decks/marine-deck-v.png')"></div>
        <div class="row back">
          <div class="slot empty">B1 · Arrière</div>
          <div class="slot unit"><span class="cost">2</span><div class="art" style="background-image:url('/cards/tashigi.jpg')"></div><div class="ov"><div class="nm">Tashigi</div><div class="st"><span class="a">4</span><span class="d">2</span><span class="h">5</span></div></div></div>
          <div class="slot empty">B3</div>
        </div>
        <div class="row front">
          <div class="slot unit"><span class="cost">3</span><div class="art" style="background-image:url('/cards/smoker.jpg')"></div><div class="ov"><div class="nm">Smoker</div><div class="st"><span class="a">5</span><span class="d">3</span><span class="h">6</span></div></div></div>
          <div class="slot empty">V2 · Avant</div>
          <div class="slot unit"><span class="cost">2</span><div class="art" style="background-image:url('/cards/momonga.jpg')"></div><div class="ov"><div class="nm">Momonga</div><div class="st"><span class="a">4</span><span class="d">3</span><span class="h">5</span></div></div></div>
        </div>
      </div>
    </div>
    <div class="clash"><div class="l"></div><div class="t">⚔ TOUR 6 ⚔</div><div class="l"></div></div>
    <div class="half">
      <div class="cap"><div class="capimg" style="background-image:url('/cards/luffy-recto.jpg')"></div><div class="capnm">Luffy</div><div class="capbar"><i style="width:78%"></i></div></div>
      <div class="deck">
        <div class="floor" style="background-image:url('/decks/mugiwara-deck-v.png')"></div>
        <div class="row front">
          <div class="slot unit"><span class="cost">3</span><div class="art" style="background-image:url('/cards/zoro.jpg')"></div><div class="ov"><div class="nm">Zoro</div><div class="st"><span class="a">6</span><span class="d">3</span><span class="h">7</span></div></div></div>
          <div class="slot unit"><span class="cost">2</span><div class="art" style="background-image:url('/cards/sanji.jpg')"></div><div class="ov"><div class="nm">Sanji</div><div class="st"><span class="a">5</span><span class="d">2</span><span class="h">6</span></div></div></div>
          <div class="slot empty">V3 · Avant</div>
        </div>
        <div class="row back">
          <div class="slot unit"><span class="cost">3</span><div class="art" style="background-image:url('/cards/robin.jpg')"></div><div class="ov"><div class="nm">Robin</div><div class="st"><span class="a">4</span><span class="d">2</span><span class="h">6</span></div></div></div>
          <div class="slot empty">B2 · Arrière</div>
          <div class="slot empty">B3</div>
        </div>
      </div>
    </div>
  </div>
  <footer>
    <div class="hand">
      <div class="h" style="background-image:url('/cards/nami.jpg')"></div>
      <div class="h" style="background-image:url('/cards/usopp.jpg')"></div>
      <div class="h" style="background-image:url('/cards/chopper.jpg')"></div>
      <div class="h" style="background-image:url('/cards/franky.jpg')"></div>
    </div>
    <div class="cta"><button class="btn">Fin de tour</button><button class="btn-x">✕</button></div>
  </footer>
</div>
</body>
</html>
