<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Test 3 — Avis de recherche</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Oswald:wght@500;700&family=Spectral:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Spectral',serif;background:#1a120a;color:#2a1c0e;-webkit-font-smoothing:antialiased}
.phone{max-width:440px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
  background:#d8c29a;background-image:
    radial-gradient(circle at 20% 10%,rgba(120,80,30,.18),transparent 40%),
    radial-gradient(circle at 80% 90%,rgba(90,50,20,.22),transparent 45%),
    url('/decks/sea.png');background-blend-mode:multiply;background-size:cover}
.paper{position:absolute;inset:0;background:linear-gradient(rgba(222,201,160,.86),rgba(205,178,132,.9));pointer-events:none}
.content{position:relative}
header{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:3px double #5a3a1a}
.brand{font-family:'Cinzel';font-weight:900;letter-spacing:.1em;color:#5a3a1a;font-size:18px}
.turn{margin-left:auto;font-family:'Cinzel';font-weight:700;font-size:12px;color:#7a1f14;border:2px solid #7a1f14;
  padding:3px 10px;transform:rotate(-2deg);text-transform:uppercase;letter-spacing:.1em}
.board{padding:12px}
.lbl{font-family:'Cinzel';font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#5a3a1a;margin:8px 2px 5px;text-align:center}
.fleet{display:flex;align-items:center;gap:8px;padding:8px;border:2px solid #6b4422;
  background:rgba(245,232,205,.55);box-shadow:0 4px 12px rgba(60,35,10,.3),inset 0 0 30px rgba(120,80,30,.15)}
.ship{width:78px;flex:none}.ship img{width:100%;filter:sepia(.5) contrast(1.05) drop-shadow(0 4px 8px rgba(50,30,10,.5))}
.units{display:flex;gap:7px;flex:1}
.card{flex:1;min-width:0;background:#f3e6c8;border:2px solid #6b4422;position:relative;padding-bottom:3px;box-shadow:0 3px 8px rgba(60,35,10,.3)}
.card .art{height:58px;background-size:cover;background-position:center 22%;filter:sepia(.55) contrast(1.05);border-bottom:2px solid #6b4422}
.card .wl{font-family:'Cinzel';font-size:7px;letter-spacing:.18em;text-align:center;color:#7a1f14;padding-top:2px}
.card .nm{font-family:'Cinzel';font-weight:700;font-size:11px;text-align:center;color:#2a1c0e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.card .st{display:flex;justify-content:center;gap:7px;font-family:'Oswald';font-weight:700;font-size:10px;color:#5a3a1a}
.cap{flex:none;width:110px}.cap .art{height:74px}
.berry{font-family:'Cinzel';font-weight:900;font-size:10px;text-align:center;color:#5a3a1a;border-top:1px solid #b89968}
.stamp{position:absolute;right:14px;top:96px;width:80px;height:80px;border:4px solid rgba(150,30,20,.6);border-radius:50%;
  color:rgba(150,30,20,.7);font-family:'Cinzel';font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;
  text-align:center;transform:rotate(-14deg);letter-spacing:.05em;z-index:5}
.vs{text-align:center;font-family:'Cinzel';font-weight:900;font-size:22px;color:#7a1f14;letter-spacing:.2em;margin:4px}
footer{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 16px;background:linear-gradient(0deg,#cdb285,transparent);border-top:3px double #5a3a1a}
.hand{display:flex;gap:7px;justify-content:center;margin-bottom:10px}
.h{width:58px;height:82px;background-size:cover;background-position:center 20%;border:2px solid #6b4422;filter:sepia(.4);box-shadow:0 4px 10px rgba(50,30,10,.5)}
.h:nth-child(1){transform:rotate(-6deg)}.h:nth-child(3){transform:rotate(6deg)}
.cta{display:flex;gap:8px}
.btn{flex:1;font-family:'Cinzel';font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:12px;border:2px solid #5a3a1a;cursor:pointer}
.btn-gold{background:linear-gradient(180deg,#c9962f,#9c6a1d);color:#2a1c0e}
.btn-x{flex:none;width:52px;background:#e7d3a8;color:#5a3a1a}
.tag{position:fixed;top:8px;left:8px;font-family:'Oswald';font-weight:700;font-size:10px;background:#5a3a1a;color:#f3e6c8;padding:4px 9px;border-radius:3px;z-index:9}
</style>
</head>
<body>
<div class="tag">TEST 3 · Avis de recherche</div>
<div class="phone">
  <div class="paper"></div>
  <div class="content">
    <header><span class="brand">⚓ TCGOP</span><span class="turn">Votre tour</span></header>
    <div class="board">
      <div class="lbl">— Marine · Adversaire —</div>
      <div class="fleet">
        <div class="ship"><img src="/decks/marine-deck-v.png"/></div>
        <div class="units">
          <div class="card cap"><div class="art" style="background-image:url('/cards/akainu-recto.jpg')"></div><div class="wl">WANTED</div><div class="nm">Akainu</div><div class="st"><span>⚔9</span><span>🛡4</span></div><div class="berry">฿ 500 000 000</div></div>
          <div class="card"><div class="art" style="background-image:url('/cards/smoker.jpg')"></div><div class="wl">WANTED</div><div class="nm">Smoker</div><div class="st"><span>5</span><span>3</span><span>6</span></div></div>
          <div class="card"><div class="art" style="background-image:url('/cards/tashigi.jpg')"></div><div class="wl">WANTED</div><div class="nm">Tashigi</div><div class="st"><span>4</span><span>2</span><span>5</span></div></div>
        </div>
      </div>
      <div class="stamp">TOUR<br>6</div>
      <div class="vs">⚔ DUEL ⚔</div>
      <div class="lbl">— Mugiwara · Vous —</div>
      <div class="fleet">
        <div class="ship"><img src="/decks/mugiwara-deck-v.png"/></div>
        <div class="units">
          <div class="card cap"><div class="art" style="background-image:url('/cards/luffy-recto.jpg')"></div><div class="wl">WANTED</div><div class="nm">Luffy</div><div class="st"><span>⚔8</span><span>🛡3</span></div><div class="berry">฿ 1 500 000 000</div></div>
          <div class="card"><div class="art" style="background-image:url('/cards/zoro.jpg')"></div><div class="wl">WANTED</div><div class="nm">Zoro</div><div class="st"><span>6</span><span>3</span><span>7</span></div></div>
          <div class="card"><div class="art" style="background-image:url('/cards/sanji.jpg')"></div><div class="wl">WANTED</div><div class="nm">Sanji</div><div class="st"><span>5</span><span>2</span><span>6</span></div></div>
        </div>
      </div>
    </div>
    <footer>
      <div class="hand">
        <div class="h" style="background-image:url('/cards/nami.jpg')"></div>
        <div class="h" style="background-image:url('/cards/usopp.jpg')"></div>
        <div class="h" style="background-image:url('/cards/chopper.jpg')"></div>
      </div>
      <div class="cta"><button class="btn btn-gold">Fin de tour</button><button class="btn btn-x">✕</button></div>
    </footer>
  </div>
</div>
</body>
</html>
