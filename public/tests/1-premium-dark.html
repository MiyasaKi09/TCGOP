<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Test 1 — Premium Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@600;800&family=Oswald:wght@400;500;600;700&family=Spectral:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{ --gold:#e8b84b; --atk:#ff7062; --def:#7fb0e8; --hp:#5bc46a; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Spectral',serif;background:#04060a;color:#fff;-webkit-font-smoothing:antialiased}
.phone{max-width:440px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
  background:linear-gradient(rgba(4,8,14,.55),rgba(4,8,14,.7)),url('/decks/sea.png') center/cover;}
.grain{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(2,4,8,.7));pointer-events:none}
/* HEADER HUD */
header{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(180deg,rgba(8,12,18,.85),rgba(8,12,18,.25));backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(232,184,75,.25)}
.brand{font-family:'Cinzel';font-weight:800;letter-spacing:.08em;color:var(--gold);font-size:15px}
.turn{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:'Oswald';font-size:12px;
  text-transform:uppercase;letter-spacing:.12em;color:#9fe6a8;background:rgba(91,196,106,.12);
  border:1px solid rgba(91,196,106,.4);padding:4px 10px;border-radius:999px}
.turn b{width:7px;height:7px;border-radius:50%;background:#5bc46a;box-shadow:0 0 8px #5bc46a}
.hud{display:flex;gap:8px;font-family:'Oswald';font-size:11px;color:rgba(255,255,255,.6)}
.hud span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:3px 8px;border-radius:8px}
/* BOARD */
.board{position:relative;padding:10px}
.side-label{font-family:'Oswald';text-transform:uppercase;letter-spacing:.2em;font-size:10px;
  color:rgba(255,255,255,.4);margin:6px 2px}
.fleet{position:relative;display:flex;align-items:center;gap:8px;padding:8px;border-radius:18px;
  background:linear-gradient(180deg,rgba(12,18,28,.55),rgba(8,12,18,.35));border:1px solid rgba(255,255,255,.06)}
.ship{width:84px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.ship img{width:100%;display:block}
.units{display:flex;gap:7px;flex:1}
/* CAPTAIN card */
.cap{flex:none;width:104px;border-radius:14px;overflow:hidden;position:relative;
  border:1px solid rgba(232,184,75,.5);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.cap .art{height:74px;background-size:cover;background-position:center 20%}
.cap .body{padding:6px 8px;background:linear-gradient(180deg,rgba(10,14,20,.6),rgba(8,12,18,.95))}
.cap .nm{font-family:'Cinzel';font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:99px;background:rgba(0,0,0,.5);overflow:hidden;margin:4px 0 3px;border:1px solid rgba(0,0,0,.6)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3aa050,#5bc46a)}
.stat{display:flex;gap:8px;font-family:'Oswald';font-weight:700;font-size:11px}
.stat .a{color:var(--atk)} .stat .d{color:var(--def)} .stat .h{color:var(--hp)}
/* unit token */
.u{flex:1;min-width:0;border-radius:12px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.1);
  box-shadow:0 5px 14px rgba(0,0,0,.5);background:#0b0e13}
.u .art{height:62px;background-size:cover;background-position:center 22%}
.u .ov{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;background:linear-gradient(180deg,transparent,rgba(5,8,12,.95));
  font-family:'Oswald'}
.u .nm{font-size:9.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .st{display:flex;gap:5px;font-size:10px;font-weight:700}
.cost{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:rgba(6,9,14,.9);
  border:1.5px solid var(--gold);color:var(--gold);font-family:'Oswald';font-weight:700;font-size:11px;
  display:flex;align-items:center;justify-content:center}
.vs{display:flex;align-items:center;gap:10px;margin:12px 4px}
.vs .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,75,.5),transparent)}
.vs .t{font-family:'Cinzel';font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--gold)}
/* HAND + footer */
footer{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 16px;
  background:linear-gradient(0deg,rgba(4,8,14,.92),transparent)}
.hand{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.h{width:62px;height:88px;border-radius:10px;background-size:cover;background-position:center 20%;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 18px rgba(0,0,0,.6);transform-origin:bottom}
.h:nth-child(1){transform:rotate(-6deg) translateY(6px)}
.h:nth-child(3){transform:rotate(6deg) translateY(6px)}
.cta{display:flex;gap:8px}
.btn{flex:1;font-family:'Oswald';font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:13px;border-radius:13px;border:none;font-size:14px}
.btn-gold{background:linear-gradient(180deg,#f0c760,#d9a434);color:#0a0d12;box-shadow:0 6px 18px rgba(217,164,52,.4)}
.btn-ghost{flex:none;width:54px;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.14)}
.tag{position:fixed;top:8px;left:8px;font-family:'Oswald';font-size:10px;background:rgba(0,0,0,.6);
  padding:4px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.15);z-index:9}
</style>
</head>
<body>
<div class="tag">TEST 1 · Premium Dark</div>
<div class="phone">
  <div class="grain"></div>
  <header>
    <span class="brand">TCGOP</span>
    <span class="turn"><b></b>Votre tour</span>
  </header>
  <div class="board">
    <div class="hud" style="justify-content:flex-end"><span>Main 6</span><span>Deck 44</span></div>
    <div class="side-label">⚓ Marine — Adversaire</div>
    <div class="fleet">
      <div class="ship"><img src="/decks/marine-deck-v.png" alt=""/></div>
      <div class="units">
        <div class="cap"><div class="art" style="background-image:url('/cards/akainu-recto.jpg')"></div>
          <div class="body"><div class="nm">Akainu</div><div class="bar"><i style="width:100%"></i></div>
          <div class="stat"><span class="a">⚔9</span><span class="d">🛡4</span></div></div></div>
        <div class="u"><span class="cost">3</span><div class="art" style="background-image:url('/cards/smoker.jpg')"></div>
          <div class="ov"><div class="nm">Smoker</div><div class="st"><span class="a" style="color:var(--atk)">5</span><span class="d" style="color:var(--def)">3</span><span class="h" style="color:var(--hp)">6</span></div></div></div>
        <div class="u"><span class="cost">2</span><div class="art" style="background-image:url('/cards/tashigi.jpg')"></div>
          <div class="ov"><div class="nm">Tashigi</div><div class="st"><span style="color:var(--atk)">4</span><span style="color:var(--def)">2</span><span style="color:var(--hp)">5</span></div></div></div>
      </div>
    </div>
    <div class="vs"><div class="line"></div><div class="t">TOUR 6</div><div class="line"></div></div>
    <div class="side-label">🏴‍☠️ Mugiwara — Vous</div>
    <div class="fleet">
      <div class="ship"><img src="/decks/mugiwara-deck-v.png" alt=""/></div>
      <div class="units">
        <div class="cap"><div class="art" style="background-image:url('/cards/luffy-recto.jpg')"></div>
          <div class="body"><div class="nm">Luffy</div><div class="bar"><i style="width:78%"></i></div>
          <div class="stat"><span class="a">⚔8</span><span class="d">🛡3</span></div></div></div>
        <div class="u"><span class="cost">3</span><div class="art" style="background-image:url('/cards/zoro.jpg')"></div>
          <div class="ov"><div class="nm">Zoro</div><div class="st"><span style="color:var(--atk)">6</span><span style="color:var(--def)">3</span><span style="color:var(--hp)">7</span></div></div></div>
        <div class="u"><span class="cost">2</span><div class="art" style="background-image:url('/cards/sanji.jpg')"></div>
          <div class="ov"><div class="nm">Sanji</div><div class="st"><span style="color:var(--atk)">5</span><span style="color:var(--def)">2</span><span style="color:var(--hp)">6</span></div></div></div>
      </div>
    </div>
  </div>
  <footer>
    <div class="hand">
      <div class="h" style="background-image:url('/cards/nami.jpg')"></div>
      <div class="h" style="background-image:url('/cards/usopp.jpg')"></div>
      <div class="h" style="background-image:url('/cards/chopper.jpg')"></div>
    </div>
    <div class="cta">
      <button class="btn btn-gold">Fin de tour ➜</button>
      <button class="btn btn-ghost">✕</button>
    </div>
  </footer>
</div>
</body>
</html>
