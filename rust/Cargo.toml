[workspace]
resolver = "2"
members = ["crates/engine", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "ISC"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
thiserror = "2"

# Fast dev iteration: optimise dependencies (Bevy) even in dev, keep our code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
